name: Production Deployment

on:
  workflow_dispatch:

jobs:
  run-tests:
    uses: ./.github/workflows/ci.yml

  call-deploy:
    needs: run-tests
    name: Trigger Prod Deploy
    uses: ./.github/workflows/deploy-shared.yml
    with:
      environment_name: prod
      runner_tag: prod
      include_local_db: false
    secrets: inherit
