name: Continuous Integration

on:
  pull_request:
    branches: [main, dev]
  workflow_call:

jobs:
  test:
    name: Run Tests and Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Build check
        run: npm run build

      - name: Run unit tests
        run: npm test -- --passWithNoTests

      - name: Start test database
        run: |
          touch .env
          docker compose --profile with-test-db up -d --wait postgres_test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Stop test database
        if: always()
        run: docker compose --profile with-test-db down || true
